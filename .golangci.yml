version: "2"

run:
  timeout: 10m
  issues-exit-code: 1
  tests: false
  modules-download-mode: readonly

formatters:
  settings:
    goimports:
      local-prefixes:
        - github.com/ZOEKOFK/video_web_v3

linters:
  default: standard
  enable:
    - govet
    - staticcheck
    - gocyclo
    - funlen
    - gocognit
    - revive
    - gosec
    - ineffassign
    - unconvert
    - unused
    - misspell
    - bodyclose
    - nilerr
    - predeclared
    - rowserrcheck
    - sqlclosecheck
    - unparam
    - wastedassign

  disable:
    - errcheck
    - exhaustive
    - wrapcheck
    - prealloc
    - contextcheck
    - noctx

  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - nilness

    gocyclo:
      min-complexity: 20

    funlen:
      lines: 100
      statements: 50

    gocognit:
      min-complexity: 25

    revive:
      rules:
        - name: context-as-argument
        - name: context-keys-type
        - name: error-return
        - name: time-equal
        - name: indent-error-flow
        - name: error-naming

    gosec:
      severity: medium
      confidence: medium
      excludes:
        - G204
        - G307
        - G115

    misspell:
      locale: US

  exclusions:
    rules:
      - path: test_glm\.go$
        linters:
          - all

      - path: _test\.go
        linters:
          - gocyclo
          - funlen
          - gocognit
          - gosec
          - revive
          - unused

      - path: (generated|pb)\.go$
        linters:
          - all

      - text: "^func main\\("
        linters:
          - funlen
          - gocognit
          - gocyclo

      - text: "^func init\\("
        linters:
          - gocyclo
          - funlen

      - path: (chat_hub|chat_types)\.go$
        linters:
          - unused

issues:
  max-issues-per-linter: 50
  max-same-issues: 3
  new: false
