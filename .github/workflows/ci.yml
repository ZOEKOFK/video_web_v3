name: CI

on:
  push:
    branches: [ main, feat/agent ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'go' ]
        include:
          - language: go
            working-directory: ./app

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}

    - name: Autobuild
      uses: github/codeql-action/autobuild@v4
      with:
        working-directory: ${{ matrix.working-directory }}

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"

  lint-api-gateway:
    name: Lint (api_gateway)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'

    - name: Download dependencies (api_gateway)
      run: cd api_gateway && go mod download

    - name: Run golangci-lint (api_gateway)
      uses: golangci/golangci-lint-action@v6
      with:
        version: latest
        working-directory: api_gateway
        args: --timeout=5m

  lint-app:
    name: Lint (app)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'

    - name: Download dependencies (app)
      run: cd app && go mod download

    - name: Run golangci-lint (app)
      uses: golangci/golangci-lint-action@v6
      with:
        version: latest
        working-directory: app
        args: --timeout=5m
