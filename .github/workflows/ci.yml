name: CI

on:
  push:
    branches: [ main, feat/agent ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [ 'go' ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - name: Autobuild
        uses: github/codeql-action/autobuild@v4
        with:
          working-directory: ./app
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{matrix.language}}"

  lint-api-gateway:
    name: Lint (api_gateway)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: api_gateway/go.sum
      - name: Install dependencies
        working-directory: api_gateway
        run: |
          go mod download
          go mod verify
      - name: Run golangci-lint (api_gateway)
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.62.0
          working-directory: api_gateway
          args: --timeout=10m

  lint-app:
    name: Lint (app)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: app/go.sum
      - name: Install dependencies
        working-directory: app
        run: |
          go mod download
          go mod verify
      - name: Run golangci-lint (app)
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.62.0
          working-directory: app
          args: --timeout=10m
